[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tv-scanner"
version = "0.1.0"
description = "Production-quality live US stock scanner with Pine-compatible signal logic"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "pandas>=2.2",
    "numpy>=1.26",
    "pytz>=2024.1",
    "aiohttp>=3.9",
    "aiosqlite>=0.20",
    "SQLAlchemy[asyncio]>=2.0",
    "tenacity>=8.3",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "structlog>=24.1",
    "rich>=13.7",
    "typer>=0.12",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.1",
    "yfinance>=0.2.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "anyio>=4.4",
]

[project.scripts]
tv-scanner = "scanner.cli:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.setuptools.packages.find]
where = ["."]
include = ["scanner*"]

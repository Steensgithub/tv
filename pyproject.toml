[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tv-scanner"
version = "0.1.0"
description = "Production-ready live long-signal scanner for US-listed equities"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "aiohttp>=3.9",
    "websockets>=12.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "pytz>=2024.1",
    "tenacity>=8.2",
    "structlog>=24.1",
    "rich>=13.7",
    "orjson>=3.9",
    "aiosqlite>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pandas-stubs",
    "mypy>=1.9",
    "ruff>=0.4",
]
yfinance = ["yfinance>=0.2"]

[project.scripts]
tv-scanner = "scanner:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

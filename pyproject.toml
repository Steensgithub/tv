[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sun-structure-scanner"
version = "0.1.0"
description = "Live US stock scanner matching Sun Structure-Confirm Signals"
requires-python = ">=3.12"
dependencies = [
  "aiohttp>=3.10.0",
  "websockets>=12.0",
  "python-dateutil>=2.9.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.24.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.setuptools]
py-modules = [
  "alerts",
  "bar_aggregator",
  "config",
  "data_provider",
  "main",
  "models",
  "polygon_provider",
  "scanner",
  "signal_engine",
  "state_store",
]
